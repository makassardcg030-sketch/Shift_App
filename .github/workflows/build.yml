name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git autoconf automake libtool libltdl-dev \
            pkg-config cmake libncurses-dev libffi-dev libssl-dev \
            zlib1g-dev unzip zip

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.6.0" "setuptools<81" virtualenv "cython<3.0"

      # python-for-android dipasang dari tag resmi, lalu receiver widget disisipkan
      # ke template AndroidManifest-nya (tidak ada opsi bawaan untuk ini).
      - name: Prepare python-for-android with widget receiver
        run: |
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git "$HOME/p4a"
          python tools/patch_p4a.py "$HOME/p4a" widget_res/receiver.xml
          pip install -e "$HOME/p4a"
          sed -i "/^\[app\]/a p4a.source_dir = $HOME/p4a" buildozer.spec
          grep -n "p4a" buildozer.spec

      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK with Buildozer
        run: |
          set -o pipefail
          # Menggunakan stdbuf atau membatasi output verbose jika memungkinkan, 
          # atau langsung arahkan output ke log file tanpa 'tee' jika terminal tidak membutuhkannya
          buildozer -v android debug > build.log 2>&1 || {
            tail -n 100 build.log
            exit 1
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          if-no-files-found: error
